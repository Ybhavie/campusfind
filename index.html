<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusFind | Student</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f4f8; margin: 0; }
    nav { background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.08); padding: 12px 20px; display: flex; gap: 16px; align-items: center; }
    nav .brand { font-weight: bold; font-size: 18px; margin-right: auto; }
    nav a { text-decoration: none; color: #444; padding: 6px 12px; border-radius: 6px; font-size: 14px; }
    nav a.active { background: #2563eb; color: #fff; }
    .wrap { display: flex; justify-content: center; padding: 32px 16px; }
    .card { background: #fff; padding: 28px; border-radius: 10px; width: 100%; max-width: 440px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
    h2 { margin: 0 0 6px; }
    p.sub { margin: 0 0 20px; color: #555; font-size: 14px; }
    label { display: block; font-size: 14px; margin-bottom: 4px; font-weight: bold; }
    input, textarea, select { width: 100%; padding: 10px; margin-bottom: 14px; border: 1px solid #bbb; border-radius: 6px; box-sizing: border-box; font-size: 15px; font-family: inherit; }
    textarea { height: 120px; resize: vertical; }
    button { width: 100%; padding: 11px; background: #2563eb; color: #fff; border: 0; border-radius: 6px; font-size: 16px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    small { display: block; color: #666; }
    .foot { margin-top: 14px; text-align: center; }
  </style>
</head>
<body>
  <nav>
    <span class="brand">CampusFind</span>
    <a class="active" href="index.html">Student</a>
    <a href="admin.html">Data</a>
  </nav>
  <div class="wrap">
    <div class="card">
      <h2>Report a lost or found item</h2>
      <p class="sub">Lost something on campus, or found something that is not yours? Tell us here so it can reach the right person.</p>
      <form action="https://humble-capybara-v6gq4976ww9whx9wr-80.app.github.dev/submit.php" method="POST" enctype="multipart/form-data">
        <label for="type">What happened?</label>
        <select id="type" name="type" required>
          <option value="">Choose one</option>
          <option value="LOST">I lost something</option>
          <option value="FOUND">I found something</option>
        </select>

        <label for="name">Your name</label>
        <input id="name" type="text" name="name" placeholder="Your name" maxlength="50" required>

        <label for="email">Your email</label>
        <input id="email" type="email" name="email" placeholder="So we can contact you" maxlength="100" required>

        <label for="message">Item details</label>
        <textarea id="message" name="message" placeholder="What is the item, where and when was it lost or found?" required></textarea>

        <label for="image">Photo of the item (optional)</label>
        <input id="image" type="file" name="image" accept="image/png, image/jpeg, image/webp">
        <small style="margin:-8px 0 14px">JPG, PNG or WEBP, up to 2 MB.</small>

        <button type="submit">Submit</button>
      </form>
      <small class="foot">CampusFind | TYBCA ISA3 project</small>
    </div>
  </div>
</body>
</html>
